
name: Release - Compagnon Immobilier

on:
  push:
    branches: [master]

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt

      - name: Vérifier le code avec Flake8
        run: flake8 src tests --select=E9,F63,F7,F82

      - name: Exécuter les tests unitaires
        run: python -m pytest tests/ -v

      - name: Connexion à DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire et publier les images Docker
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker build -f Dockerfile.api -t $HUB_USER/compagnon-api:latest .
          docker push $HUB_USER/compagnon-api:latest

          docker build -f Dockerfile.mlflow -t $HUB_USER/compagnon-mlflow:latest .
          docker push $HUB_USER/compagnon-mlflow:latest

          docker build -f streamlit/Dockerfile -t $HUB_USER/compagnon-streamlit:latest .
          docker push $HUB_USER/compagnon-streamlit:latest
