name: Release - Compagnon Immobilier

on:
  push:
    branches: [tests_githubAction_kaw] # master

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt

      - name: Vérifier le code avec Flake8
        run: flake8 src tests --select=E9,F63,F7,F82

      - name: Exécuter les tests unitaires
        env:
          JWT_SECRET_KEY: "cle-tests"
          ADMIN_PASSWORD_HASH: "hash-test"
          USER_PASSWORD_HASH: "hash-test"
        run: python -m pytest tests/ -v

      - name: Connexion à DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # API FASTAPI
      - name: Build et Push - API
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker build -f Dockerfile.api -t $HUB_USER/compagnon-api:latest .
          docker push $HUB_USER/compagnon-api:latest

      # MLFLOW
      - name: Build et Push - MLflow
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker build -f Dockerfile.mlflow -t $HUB_USER/compagnon-mlflow:latest .
          docker push $HUB_USER/compagnon-mlflow:latest

      # STREAMLIT
      - name: Build et Push - Streamlit
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker build -f streamlit/Dockerfile -t $HUB_USER/compagnon-streamlit:latest .
          docker push $HUB_USER/compagnon-streamlit:latest

      # AIRFLOW
      - name: Build et Push - Airflow
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker build -f Dockerfile.airflow -t $HUB_USER/compagnon-airflow:latest .
          docker push $HUB_USER/compagnon-airflow:latest

      # EVIDENTLY
      - name: Build et Push - Evidently
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker build -f Dockerfile.evidently -t $HUB_USER/compagnon-evidently:latest .
          docker push $HUB_USER/compagnon-evidently:latest